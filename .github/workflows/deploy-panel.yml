name: Publicar panel EFECTO TV
on:
  push:
    branches: [main]
    paths:
      - "panel/**"
      - ".github/workflows/deploy-panel.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: panel
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

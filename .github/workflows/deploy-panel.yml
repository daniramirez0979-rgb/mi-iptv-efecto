name: Publicar paneles web
on:
  push:
    branches: [main]
    paths:
      - "panel/**"
      - "efecto-limpio/**"
      - ".github/workflows/deploy-panel.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar ambos paneles
        run: |
          mkdir -p site/efecto-limpio
          cp -a panel/. site/
          cp -a efecto-limpio/. site/efecto-limpio/
      - name: Subir sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5.0.1

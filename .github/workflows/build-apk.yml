name: Compilar Mi IPTV Efecto

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restaurar firma permanente o preparar firma nueva
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
            echo "Firma permanente restaurada."
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "Sin firma permanente: se compila el artefacto de prueba, pero NO se publica como actualización."
            echo "SIGNING_READY=false" >> "$GITHUB_ENV"
          fi

      - name: Preparar Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Descomprimir proyecto
        run: |
          if [ ! -f app/src/main/java/com/efectolimpio/miiptvefecto/MainActivity.kt ]; then
            unzip -oq MiIPTV_Efecto_Compilacion_Automatica.zip -d .
          fi
          find . -maxdepth 6 \( -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ajustar compatibilidad Java y Kotlin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = list(Path('.').rglob('build.gradle')) + list(Path('.').rglob('build.gradle.kts'))
          app = [p for p in candidates if p.parent.name == 'app' and ('com.android.application' in p.read_text(errors='ignore') or 'com.android.library' in p.read_text(errors='ignore'))]
          if not app:
              raise SystemExit("No se encontró el build.gradle del módulo Android")
          p = app[0]
          with p.open('a') as f:
              if p.name.endswith('.kts'):
                  f.write("""
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions { jvmTarget = "17" }
          }
          """)
              else:
                  f.write("""
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions { jvmTarget = '17' }
          }
          """)
          print("Compatibilidad Java/Kotlin 17 aplicada en", p)
          src = Path('app/src/main/java/com/efectolimpio/miiptvefecto/MainActivity.kt')
          if not src.exists():
              raise SystemExit("No se encontró MainActivity.kt")
          code = src.read_text()
          if "this.player = activePlayer" not in code:
              bad = "AndroidView(factory = { ctx -> PlayerView(ctx).apply { player = this@MiIptvApp.player; useController = true } },"
              good = "val activePlayer = player\n                    AndroidView(factory = { ctx -> PlayerView(ctx).apply { this.player = activePlayer; useController = true } },"
              if bad in code:
                  src.write_text(code.replace(bad, good, 1))
                  print("Corregida referencia del reproductor en MainActivity.kt")
              else:
                  print("El reproductor ya tiene la referencia actualizada; se conserva el código")
          PY

      - name: Asignar versión a la APK
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s, n = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = ' + os.environ["GITHUB_RUN_NUMBER"], s, count=1)
          if n != 1:
              raise SystemExit("No se pudo actualizar versionCode")
          p.write_text(s)
          print("Versión de APK:", os.environ["GITHUB_RUN_NUMBER"])
          PY

      - name: Configurar firma permanente en Gradle
        if: env.SIGNING_READY == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          block = '''
          android {
              signingConfigs {
                  getByName("debug") {
                      storeFile = file(System.getProperty("user.home") + "/.android/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }
          '''
          if "getByName(\"debug\")" not in s:
              s += "\n" + block
              p.write_text(s)
          print("Gradle configurado para firmar explícitamente con la clave permanente.")
          PY

      - name: Compilar APK
        run: |
          PROJECT_DIR="$(dirname "$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)")"
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Preparar archivo con nombre final
        run: |
          APK_PATH="$(find . -type f -path "*/app/build/outputs/apk/debug/app-debug.apk" | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" Efecto-TV-2.0.apk
          test -s Efecto-TV-2.0.apk

      - name: Verificar identidad de la nueva aplicación
        id: compatibility
        run: |
          set -e
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          NEW_PACKAGE="$("$BUILD_TOOLS/aapt" dump badging Efecto-TV-2.0.apk | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n1)"
          NEW_CERT="$("$BUILD_TOOLS/apksigner" verify --print-certs Efecto-TV-2.0.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1 | tr 'A-F' 'a-f')"
          KEY_CERT="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')"
          echo "Paquete de la nueva app: $NEW_PACKAGE"
          echo "Certificado APK SHA-256: $NEW_CERT"
          echo "Certificado de la clave permanente SHA-256: $KEY_CERT"
          if [ "$SIGNING_READY" = "true" ] && [ "$NEW_PACKAGE" = "com.efectolimpio.miiptvefecto.nueva3" ] && [ -n "$KEY_CERT" ] && [ "$NEW_CERT" = "$KEY_CERT" ]; then
            echo "UPDATE_COMPATIBLE=true" >> "$GITHUB_ENV"
            echo "Identidad nueva verificada."
          else
            echo "UPDATE_COMPATIBLE=false" >> "$GITHUB_ENV"
            echo "::error::La APK no tiene la identidad esperada; no se publicará."
            exit 1
          fi

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Efecto-TV-2.0
          path: Efecto-TV-2.0.apk
          if-no-files-found: error

      - name: Publicar nueva instalación estable de Efecto TV
        if: env.SIGNING_READY == 'true' && env.UPDATE_COMPATIBLE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: efecto-tv-2.0
          name: EFECTO TV 2.0
          files: Efecto-TV-2.0.apk
          make_latest: true

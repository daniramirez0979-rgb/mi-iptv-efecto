name: Compilar Mi IPTV Efecto

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Descomprimir proyecto
        run: |
          unzip -oq MiIPTV_Efecto_Compilacion_Automatica.zip -d .
          find . -maxdepth 6 \( -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ajustar compatibilidad Java y Kotlin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = list(Path('.').rglob('build.gradle')) + list(Path('.').rglob('build.gradle.kts'))
          app = [p for p in candidates if 'com.android.application' in p.read_text(errors='ignore')]
          if not app:
              raise SystemExit("No se encontró el build.gradle del módulo Android")
          p = app[0]
          with p.open('a') as f:
              if p.name.endswith('.kts'):
                  f.write("""
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions { jvmTarget = "17" }
          }
          """)
              else:
                  f.write("""
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions { jvmTarget = '17' }
          }
          """)
          print("Compatibilidad Java/Kotlin 17 aplicada en", p)
          PY

      - name: Compilar APK
        run: |
          PROJECT_DIR="$(dirname "$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)")"
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-IPTV-Efecto-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error

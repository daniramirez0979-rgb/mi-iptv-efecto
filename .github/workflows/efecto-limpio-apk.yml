name: Compilar APK Efecto Limpio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "efecto-limpio-android/**"
      - ".github/workflows/efecto-limpio-apk.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar APK administrador
        working-directory: efecto-limpio-android
        run: gradle --no-daemon assembleDebug
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Efecto-Limpio-Administrador
          path: efecto-limpio-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

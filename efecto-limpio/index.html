<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075985"><title>Efecto Limpio · Administración</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#15354a;background:#edf5fa}*{box-sizing:border-box}body{margin:0}.head{background:linear-gradient(120deg,#06385d,#087fa8);color:#fff;padding:18px 16px;box-shadow:0 4px 18px #073b5c30}.brand{font-size:24px;font-weight:900;letter-spacing:.3px}.sub{font-size:13px;opacity:.85;margin-top:3px}.wrap{max-width:1050px;margin:20px auto;padding:0 13px}.card{background:white;border:1px solid #dce9f0;border-radius:17px;padding:18px;box-shadow:0 8px 25px #123d5810;margin-bottom:14px}.login{max-width:460px;margin:8vh auto}.h{font-size:22px;font-weight:850;margin:0 0 7px}.muted{color:#637c8d;font-size:13px;line-height:1.5}label{display:block;font-size:13px;font-weight:700;margin:13px 0 6px}input,select{width:100%;padding:12px;border:1px solid #cbdde7;border-radius:10px;font-size:16px;background:#fff;color:#16384c}button{border:0;border-radius:10px;padding:12px 15px;background:#087da5;color:#fff;font-size:14px;font-weight:750;cursor:pointer}.wide{width:100%;margin-top:14px}.secondary{background:#e7f1f6;color:#14506b}.danger{background:#a83d4b}.nav{display:flex;gap:7px;overflow:auto;margin-bottom:13px}.nav button{white-space:nowrap;background:#dfebf2;color:#16455e}.nav button.on{background:#087da5;color:white}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:15px 0}.metric{background:#f2f8fb;border:1px solid #e0edf3;border-radius:13px;padding:14px}.metric b{display:block;font-size:25px;color:#075985}.metric span{font-size:12px;color:#61798a}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:10px;border-bottom:1px solid #e7eef2;white-space:nowrap}th{background:#f5f9fb;color:#557184}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.notice{font-size:13px;color:#08734b;margin-top:10px}.hidden{display:none!important}.foot{text-align:center;color:#708696;font-size:12px;padding:12px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid .full{grid-column:1/-1}@media(max-width:560px){.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}.wrap{margin:13px auto}.card{padding:15px}}
</style></head><body>
<header class="head"><div class="brand">🫧 EFECTO LIMPIO</div><div class="sub">Administración · A-J Distribuciones</div></header>
<main class="wrap">
<section id="login" class="card login"><h1 class="h">Panel de administración</h1><p class="muted">Ingresá con tu correo administrador. Te enviamos un enlace seguro, sin contraseña.</p><label>Correo electrónico</label><input id="email" type="email" value="damiandeluca22@gmail.com" autocomplete="email"><button id="send" class="wide">Enviar enlace de acceso</button><p id="loginmsg" class="notice"></p></section>
<section id="app" class="hidden"><div class="row" style="margin:0 2px 12px"><span class="muted" id="welcome">Panel de control</span><button id="logout" class="secondary">Cerrar sesión</button></div><nav class="nav" id="nav"><button class="on" data-tab="home">Inicio</button><button data-tab="products">Productos</button><button data-tab="customers">Clientes</button><button data-tab="orders">Ventas</button><button data-tab="vendor_commissions">Comisiones</button></nav><section class="card" id="view"></section></section>
<div class="foot">Efecto Limpio · A-J Distribuciones · WhatsApp 3765-149583</div></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://edypzlttwcdrvwwvcouj.supabase.co','sb_publishable_C0w7aVDR9t3WiiWH5ejfDw_8xWw4atg');
const $=id=>document.getElementById(id);const login=$('login'),app=$('app'),view=$('view');let currentUser=null;
const titles={products:'Productos',customers:'Clientes',orders:'Ventas',vendor_commissions:'Comisiones'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(v||0));
async function gate(session){if(!session){login.classList.remove('hidden');app.classList.add('hidden');return}const {data:p,error}=await db.from('profiles').select('full_name,role,active,access_status').eq('id',session.user.id).maybeSingle();if(error||!p||p.role!=='admin'||p.active!==true||p.access_status!=='active'){await db.auth.signOut();$('loginmsg').textContent='Este usuario no tiene permisos de administrador activos.';return}currentUser=session.user;login.classList.add('hidden');app.classList.remove('hidden');$('welcome').textContent='Hola, '+(p.full_name||'administrador');await dashboard()}
async function dashboard(){const tabs=['products','customers','orders','vendor_commissions'];const rs=await Promise.all(tabs.map(t=>db.from(t).select('*',{count:'exact',head:true})));view.innerHTML='<h1 class="h">Resumen general</h1><p class="muted">Administrá tu negocio desde un solo lugar.</p><div class="metrics">'+tabs.map((t,i)=>'<div class="metric"><b>'+(rs[i].count??'—')+'</b><span>'+titles[t]+'</span></div>').join('')+'</div><p class="muted">Elegí Productos para actualizar precios, Clientes para cargar compradores o Ventas para revisar movimientos.</p>'}
async function list(tab){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));if(tab==='home')return dashboard();view.innerHTML='<h2 class="h">'+titles[tab]+'</h2><p class="muted">Cargando información…</p>';let query=db.from(tab).select('*').limit(100);if(tab==='products'||tab==='customers'||tab==='orders'||tab==='vendor_commissions')query=query.order('created_at',{ascending:false});const {data,error}=await query;if(error){view.innerHTML='<h2 class="h">'+titles[tab]+'</h2><p class="muted">No se pudo consultar: '+esc(error.message)+'</p>';return}let cols=tab==='products'?['name','unit','retail_price','wholesale_price','active']:tab==='customers'?['name','business_name','phone','city']:tab==='orders'?['order_number','status','total','customer_paid','created_at']:['vendor_id','sale_amount','commission_rate','commission_amount','paid_at'];let rows=data||[];view.innerHTML='<div class="row"><h2 class="h">'+titles[tab]+'</h2>'+(tab==='products'||tab==='customers'?'<button id="add">＋ Agregar</button>':'')+'</div>'+(rows.length?'<div class="tablewrap"><table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+(tab==='products'?'<th>Acción</th>':'')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(c==='retail_price'||c==='wholesale_price'||c==='total'||c==='sale_amount'||c==='commission_amount'?money(r[c]):r[c])+'</td>').join('')+(tab==='products'?'<td><button class="secondary edit" data-id="'+r.id+'">Editar</button></td>':'')+'</tr>').join('')+'</tbody></table></div>':'<p class="muted">Todavía no hay registros.</p>')+'<p class="muted">Se muestran hasta 100 registros.</p>';if($('add'))$('add').onclick=()=>form(tab);document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>form(tab,rows.find(r=>r.id===b.dataset.id)))}
function form(tab,row={}){const product=tab==='products';view.innerHTML='<h2 class="h">'+(row.id?'Editar ':'Nuevo ')+(product?'producto':'cliente')+'</h2><div class="formgrid">'+(product?'<div class="full"><label>Nombre</label><input id="f_name" value="'+esc(row.name)+'"></div><div><label>Unidad</label><input id="f_unit" value="'+esc(row.unit||'5 L')+'"></div><div><label>Precio minorista</label><input id="f_retail" type="number" min="0" value="'+esc(row.retail_price??row.price??'')+'"></div><div><label>Precio mayorista</label><input id="f_wholesale" type="number" min="0" value="'+esc(row.wholesale_price??'')+'"></div><div><label>Activo</label><select id="f_active"><option value="true" '+(row.active!==false?'selected':'')+'>Sí</option><option value="false" '+(row.active===false?'selected':'')+'>No</option></select></div>':'<div class="full"><label>Nombre del cliente</label><input id="f_name" value="'+esc(row.name)+'"></div><div><label>Comercio</label><input id="f_business" value="'+esc(row.business_name)+'"></div><div><label>Teléfono</label><input id="f_phone" value="'+esc(row.phone)+'"></div><div><label>WhatsApp</label><input id="f_whatsapp" value="'+esc(row.whatsapp)+'"></div><div><label>Ciudad</label><input id="f_city" value="'+esc(row.city)+'"></div><div class="full"><label>Dirección</label><input id="f_address" value="'+esc(row.address)+'"></div>')+'</div><div class="row" style="margin-top:16px"><button id="save">Guardar</button><button class="secondary" id="back">Volver</button></div><p id="formmsg" class="notice"></p>';$('back').onclick=()=>list(tab);$('save').onclick=async()=>{const val=id=>$(id)?.value;let payload=product?{name:val('f_name').trim(),unit:val('f_unit').trim(),retail_price:Number(val('f_retail')),price:Number(val('f_retail')),wholesale_price:Number(val('f_wholesale')),active:val('f_active')==='true'}:{name:val('f_name').trim(),business_name:val('f_business'),phone:val('f_phone'),whatsapp:val('f_whatsapp'),city:val('f_city'),address:val('f_address')};if(!payload.name){$('formmsg').textContent='El nombre es obligatorio.';return}const res=row.id?await db.from(tab).update(payload).eq('id',row.id):await db.from(tab).insert(payload);if(res.error){$('formmsg').textContent='Error: '+res.error.message;return}await list(tab)}}
$('send').onclick=async()=>{const email=$('email').value.trim();$('send').disabled=true;$('loginmsg').textContent='Enviando enlace…';const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('?')[0].split('#')[0]}});$('loginmsg').textContent=error?'No se pudo enviar: '+error.message:'Enlace enviado. Abrí el correo desde este mismo celular.';$('send').disabled=false};
$('nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(b)list(b.dataset.tab)};$('logout').onclick=()=>db.auth.signOut();db.auth.onAuthStateChange((_e,s)=>setTimeout(()=>gate(s),0));const {data:{session}}=await db.auth.getSession();await gate(session);
</script></body></html>
